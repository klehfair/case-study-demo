services:
  app:
    build: .
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      APP_NAME: BrandWriterAI
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: brandwriter
      DB_USERNAME: brandwriter
      DB_PASSWORD: secret
      REDIS_CLIENT: phpredis
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_HAIKU_MODEL: ${CLAUDE_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      CLAUDE_SONNET_MODEL: ${CLAUDE_SONNET_MODEL:-claude-sonnet-4-6}
    command: >
      sh -c "php artisan migrate --force --seed &&
             php artisan config:cache &&
             php-fpm"
    networks:
      - brandwriter

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - brandwriter

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: brandwriter
      MYSQL_USER: brandwriter
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "brandwriter", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - brandwriter

  valkey:
    image: valkey/valkey:8.1-alpine
    volumes:
      - valkey_data:/data
    networks:
      - brandwriter

volumes:
  mysql_data:
  valkey_data:
  vendor_data:

networks:
  brandwriter:
    driver: bridge
